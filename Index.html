<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>أسامة & رحيق | دعوة خطوبة</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <!-- =========================
         INTRO / ENVELOPE
    ========================== -->

    <section id="intro" class="intro">

        <div class="roman-frame"></div>

        <div class="intro-content">

            <p class="small-title">
                بِسْمِ اللهِ الرَّحْمَنِ الرَّحِيمِ
            </p>

            <div id="envelope" class="envelope">

                <div class="envelope-back"></div>

                <div class="envelope-paper">
                    <span>O</span>
                    <span>&</span>
                    <span>R</span>
                </div>

                <div class="envelope-flap"></div>

                <div class="wax-seal">
                    <span>O</span>
                    <span>♡</span>
                    <span>R</span>
                </div>

            </div>

            <p class="open-text">
                اضغط لفتح الدعوة
            </p>

        </div>
    </section>


    <!-- =========================
         MAIN INVITATION
    ========================== -->

    <main id="invitation" class="invitation">

        <div class="palace-overlay"></div>

        <div class="gold-particles"></div>

        <div class="content">

            <div class="top-ornament">
                ❦
            </div>

            <p class="welcome reveal">
                بكل الحب والفرح
            </p>

            <p class="invite reveal">
                يسرّنا أن نشارككم أجمل لحظاتنا
            </p>


            <div class="names reveal">

                <div class="name">
                    <span>أسامة</span>
                </div>

                <div class="heart">
                    ♡
                </div>

                <div class="name">
                    <span>رحيق</span>
                </div>

            </div>


            <div class="divider reveal">
                <span></span>
                <i>✦</i>
                <span></span>
            </div>


            <div class="date reveal">

                <div class="date-day">
                    02
                </div>

                <div class="date-middle">
                    <span>فبراير</span>
                    <small>2027</small>
                </div>

                <div class="date-day">
                    02
                </div>

            </div>


            <p class="date-text reveal">
                2 / 2 / 2027
            </p>


            <div class="message reveal">

                <p>
                    يسرّنا حضوركم ومشاركتنا فرحتنا
                </p>

                <span>
                    فبوجودكم تكتمل سعادتنا
                </span>

            </div>


            <div class="bottom-ornament reveal">
                ✦ ❦ ✦
            </div>

        </div>


        <!-- FIREWORKS -->

        <canvas id="fireworks"></canvas>


        <!-- MUSIC -->

        <audio id="music" preload="auto">
            <source src="song.mp3" type="audio/mpeg">
        </audio>


        <!-- MUSIC BUTTON -->

        <button id="musicButton" class="music-button">
            ♫
        </button>

    </main>


    <script src="script.js"></script>

</body>
</html>
